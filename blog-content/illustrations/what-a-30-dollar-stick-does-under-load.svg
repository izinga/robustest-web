<svg viewBox="0 0 640 240" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" font-family="'IBM Plex Mono', monospace">
  <text x="40" y="24" font-size="10" letter-spacing="0.12em" fill="var(--rt-muted)">NATIVE VS WEBVIEW · 45 s OF PLAYBACK · ADB + PERFETTO</text>

  <!-- panel 1: CPU peak -->
  <text x="40" y="58" font-size="10" fill="var(--rt-muted)">cpu peak · % of 4-core SoC</text>
  <path d="M122 68 V128" stroke="var(--rt-line-strong)" stroke-width="1.25"/>
  <text x="114" y="85" text-anchor="end" font-size="10" fill="var(--rt-muted)">native</text>
  <rect x="122" y="72" width="98" height="18" rx="2" fill="var(--rt-signal)"/>
  <text x="228" y="85" font-size="11" fill="var(--rt-ink)">16.3%</text>
  <text x="114" y="113" text-anchor="end" font-size="10" fill="var(--rt-muted)">webview</text>
  <rect x="122" y="100" width="168" height="18" rx="2" fill="var(--rt-amber)"/>
  <text x="298" y="113" font-size="11" fill="var(--rt-ink)">28.0%</text>
  <path d="M122 128 H302" stroke="var(--rt-line)" stroke-width="1"/>
  <text x="122" y="142" font-size="9" fill="var(--rt-muted)">0</text>
  <text x="302" y="142" text-anchor="end" font-size="9" fill="var(--rt-muted)">30%</text>

  <!-- panel 2: memory peak, drawn against the device's full 974 MB -->
  <text x="352" y="58" font-size="10" fill="var(--rt-muted)">memory peak · RSS, of 974 MB</text>
  <path d="M434 68 V128" stroke="var(--rt-line-strong)" stroke-width="1.25"/>
  <text x="426" y="85" text-anchor="end" font-size="10" fill="var(--rt-muted)">native</text>
  <rect x="434" y="72" width="166" height="18" fill="none" stroke="var(--rt-line)" stroke-width="1"/>
  <rect x="434" y="72" width="34" height="18" rx="2" fill="var(--rt-signal)"/>
  <text x="476" y="85" font-size="11" fill="var(--rt-ink)">197 · flat</text>
  <text x="426" y="113" text-anchor="end" font-size="10" fill="var(--rt-muted)">webview</text>
  <rect x="434" y="100" width="166" height="18" fill="none" stroke="var(--rt-line)" stroke-width="1"/>
  <rect x="434" y="100" width="70" height="18" rx="2" fill="var(--rt-amber)"/>
  <text x="512" y="113" font-size="11" fill="var(--rt-ink)">412 · spike</text>
  <path d="M434 128 H600" stroke="var(--rt-line)" stroke-width="1"/>
  <text x="434" y="142" font-size="9" fill="var(--rt-muted)">0</text>
  <text x="600" y="142" text-anchor="end" font-size="9" fill="var(--rt-muted)">974 MB</text>

  <!-- the shared floor both apps sit on -->
  <text x="40" y="172" font-size="10" fill="var(--rt-muted)">shared OS pipeline under both apps · ~24–25% of SoC</text>
  <rect x="40" y="180" width="560" height="14" fill="none" stroke="var(--rt-line-strong)" stroke-width="1"/>
  <rect x="40" y="180" width="140" height="14" fill="var(--rt-line)"/>
  <text x="46" y="191" font-size="9" fill="var(--rt-ink)">drm · vpud · buffer · weston · mixer</text>

  <text x="320" y="228" text-anchor="middle" font-size="11" fill="var(--rt-muted)">same movie, same decode, same silicon — the webview tax is the app layer</text>
</svg>
